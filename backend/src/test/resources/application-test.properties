# Test profile properties (uses H2 database)
spring.datasource.url=jdbc:h2:mem:smartstock_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate test configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Expiration rate faster for tests if needed
reservation.expiration.minutes=1
reservation.expiration.check.rate=1000
