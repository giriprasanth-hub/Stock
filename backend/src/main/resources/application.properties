# Application Config
spring.application.name=smartstock

# Server Config
server.port=8080

# Database Config (MySQL default with environment variable overrides)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configurations
# Secret must be at least 256 bits (32 characters)
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=86400000

# Reservation Configurations
# Reservation expiration duration (default 10 minutes)
reservation.expiration.minutes=10
# Periodic check rate in milliseconds (every 10 seconds)
reservation.expiration.check.rate=10000

# Logging
logging.level.com.smartstock=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
